name: Build Android APK

on:
  workflow_dispatch:
  push:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase-1/one-os-architecture-blueprint' || startsWith(github.ref, 'refs/tags/v')
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run recovery-state tests
        run: npm run test:recovery

      - name: Run notification-state tests
        run: npm run test:notifications

      - name: Run Snap crypto tests
        run: npm run test:crypto

      - name: Run secure session storage tests
        run: npm run test:session

      - name: Run database-source inventory tests
        run: npm run test:database-source

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      # React Native normally skips JavaScript bundling for the debug variant.
      # Make this APK self-contained so it launches without a Metro server.
      - name: Enable JavaScript bundling in the standalone debug variant
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "android/app/build.gradle";
          let gradle = fs.readFileSync(path, "utf8");
          if (!/react\s*\{/.test(gradle)) {
            throw new Error("Could not find the React Native Gradle configuration block.");
          }
          if (!/react\s*\{\s*debuggableVariants\s*=\s*\[\s*\]/.test(gradle)) {
            gradle = gradle.replace(/react\s*\{/, match => match + "\n    debuggableVariants = []");
          }
          fs.writeFileSync(path, gradle);
          console.log("Configured debug APK to include its JavaScript bundle.");
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build standalone debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify embedded JavaScript bundle
        working-directory: android
        run: |
          bundle_path="$(find app/build -type f -name 'index.android.bundle' -size +0c -print -quit)"
          test -n "$bundle_path"
          echo "Verified embedded JavaScript bundle: $bundle_path"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONE-OS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          name: ONE-OS-debug-apk
          path: release-assets

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ONE-OS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/app-debug.apk
